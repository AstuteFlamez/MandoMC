welcome: '<aqua>Ilum: The Gathering</aqua> <gray>— a safe multiplayer adventure. Follow the lanterns, read each clue, and right-click its answer button. Your 30 checkpoints save automatically. Target: about an hour.</gray>'
arrival: '<aqua>Ilum safe zone.</aqua> <gray>Use /ilumreview to begin or resume in Adventure mode. Creative operators can inspect the build.</gray>'
preparing: '<yellow>Ilum is preparing its signs and safety checks. Try again shortly.</yellow>'
travel-denied: '<yellow>Travel was blocked. Leave combat or use /spawn, then try again.</yellow>'
already-finished: '<aqua>You have completed Ilum.</aqua> <gray>Use /ilumreview reset for a new journey, then /ilumreview start.</gray>'
reset: '<aqua>Your Ilum progress has been reset.</aqua> <gray>Other players are unaffected.</gray>'
outside: '<gray>Use /ilumreview to enter the adventure first.</gray>'
resumed: '<aqua>Your personal checkpoint and solved panels have been restored.</aqua>'
retry: '<aqua>Returned safely to your checkpoint.</aqua> <gray>Solved panels stay saved.</gray>'
need-seals: '<yellow>Read and solve all three clue panels in this room before crossing the seal.</yellow>'
attune: '<aqua>Your seals are ready.</aqua> <gray>Right-click the blue kyber crystal on the nearby dais to finish, then use /ilumreview leave.</gray>'
other-room: '<yellow>This panel belongs to another checkpoint. Continue your own route first.</yellow>'
already-solved: '<green>You already solved this panel. Continue to the next clue.</green>'
solved: '<green>Seal restored: {seals}/3.</green> <gray>Saved for you; other players keep their own progress.</gray>'
wrong: '<yellow>That does not match the clue. Read the nearby sign and try again. Your solved seals are safe.</yellow>'
actionbar: '<aqua>CP {checkpoint}/30 • {title}</aqua> <gray>• {task} • seals {seals}/3</gray>'
status: '<aqua>Ilum checkpoint {checkpoint}/30: {title}.</aqua> <gray>Personal seals: {seals}/3.</gray>'
checkpoint-title: '<aqua>Checkpoint {checkpoint}/30</aqua>'
finish-title: '<aqua>Kyber attuned</aqua>'
finish-subtitle: '<white>The Gathering is complete</white>'
finished: '<aqua>Ilum complete!</aqua> <gray>Your crystal is attuned. Journey elapsed: {minutes} minutes (includes offline time). Use /ilumreview leave to return.</gray>'
help: '<aqua>Ilum commands:</aqua> <gray>/ilumreview — begin/resume • retry — safe return • status — progress • leave — previous location/mode • reset — reset only your progress. No PvP, damage, item loss, timed jumps, or shared puzzle resets.</gray>'
