usage: '<gray>/c opens the clan menu. Use <yellow>/c help<gray> for commands.'
players-only: '<red>Use this command in game.'
invalid-name: '<red>Clan names need 3–16 letters, numbers or underscores.'
already-member: '<red>You already belong to a clan.'
name-taken: '<red>That clan name is taken.'
not-member: '<red>Join or create a clan first.'
not-leader: '<red>Only the clan leader can do that.'
unknown-clan: '<red>That clan does not exist.'
unknown-player: '<red>That player is not online.'
no-invite: '<red>You need an invitation from that clan. Invitations last five minutes.'
abandoned: '<red>This clan is abandoned. Its public-loot period cannot be cancelled.'
member-limit: '<red>This clan has reached its member limit.'
claim-limit: '<red>Your clan has reached its claim limit.'
already-claimed: '<red>That chunk is already claimed.'
zone-buffer: '<red>Leave one full wilderness chunk between your claim and safezones or warzones.'
claim-buffer: '<red>Leave one full empty chunk between your claim and another clan.'
not-owner: '<red>Your clan does not own this chunk.'
not-clanmate: '<red>Choose another member of your clan.'
leader-leave: '<red>Transfer leadership or disband before leaving.'
preparing: '<yellow>Preparing the original terrain. Try again in a moment.'
restoring: '<yellow>This land is restoring. Wait for it to finish.'
protected: '<red>This land belongs to another clan.'
failed: '<red>Clan storage is unavailable. Contact staff.'
created: '<green>Created clan <clan>.'
joined: '<green>You joined <clan>.'
invited: '<green>Invited <player> to <clan>.'
invitation: '<yellow><clan> invited you. Use /c join <clan> within five minutes.'
left: '<yellow>You left your clan.'
kicked: '<yellow>Removed <player> from the clan.'
leader: '<green><player> is now clan leader.'
disbanded: '<yellow>Clan <clan> disbanded.'
claimed: '<green>Claimed this chunk for <clan>.'
unclaimed: '<yellow>Unclaimed this chunk. It will restore after 24 hours without edits.'
home-set: '<green>Clan home set.'
no-home: '<red>Your clan needs a safe home inside its claims. Use /c sethome.'
info: '<gold><clan><gray> | Members <members> | Claims <claims> | Status <status>'
warpoints: '<gold><clan><gray> vs <rival>: <score> warpoints | Raid: <raid>'
abandonment: '<gold><clan> has been inactive for seven days. Its base at <locations> is open for everyone to loot for 24 hours!'
reclaimed: '<yellow><clan> has disbanded. Its abandoned land is returning to wilderness.'
raid-started: '<red><clan> has begun a one-hour raid against <rival>! Their warpoints reset to zero and are frozen for this raid.'
raid-ended: '<yellow>The raid between <clan> and <rival> has ended. Warpoints can be earned again.'

unprepared: '<yellow>This chunk has no completed frozen wilderness backup. Building and claiming are unavailable here.'

claim-adjacent: '<yellow>New claims must share an edge with your clan land in this world.'
unclaim-splits: '<yellow>That would split your clan land. Remove an edge claim or use /c unclaimall.'
unclaimed-all: '<yellow>All clan land unclaimed. It restores after 24 hours without edits.'
menu-busy: '<yellow>Put away your cursor/crafting items and close the current inventory, then use /c.'
not-manager: '<red>Only your clan leader or an officer can do that.'
rank-protected: '<red>You can only manage clanmates below your own rank. Use /c leader to transfer leadership.'
role-limit: '<yellow>That player cannot move further in that direction. Use /c leader for leadership transfer.'
role-changed: '<green><player> is now <role>.'
recruit-storage: '<red>Recruits cannot open, use or break clan storage.'
help:
- '<gold>/c <gray>— clan menu with roster, land, home and rivalries'
- '<yellow>/c create <name> <gray>| /c join <clan> | /c leave'
- '<yellow>/c info [clan] <gray>| /c map | /c home | /c warpoints <clan>'
- '<gray>Four members, four chunks. New claims share an edge in the same world.'
- '<gray>Leave a full empty chunk from other clans and safezones/warzones, including diagonals.'
- '<gold>Leader / Officer: <yellow>/c invite <player> | /c kick <player>'
- '<yellow>/c claim <gray>| /c unclaim | /c unclaimall'
- '<gray>Officers invite/kick lower ranks only. Unclaim cannot split land into more islands.'
- '<gold>Leader: <yellow>/c promote <player> | /c demote <player> | /c leader <player>'
- '<yellow>/c sethome <gray>| /c disband'
- '<gray>Leader > Officer > Member > Recruit. New joins are Recruit.'
- '<gray>Recruits share member permissions except opening/using/breaking clan storage.'
