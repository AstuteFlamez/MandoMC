tutorial:
  - '<gold><bold>Welcome to MandoMC — Black Spire Outpost</bold></gold>'
  - '<gray>This outpost is protected. Explore, then head to survival to establish a base.</gray>'
  - '<yellow><click:run_command:/survival><hover:show_text:"Depart for the survival landing">[Travel to survival]</hover></click></yellow><gray> or type /survival. Stand still while the shuttle prepares.</gray>'
  - '<gray>The survival landing is protected. Walk beyond its boundary to build; PvP is enabled outside.</gray>'
  - '<gray>Carried items drop on death. Store supplies at your base. Type /tutorial to read this again.</gray>'
unavailable: '<red>The arrival route is unavailable. Please contact a server administrator.</red>'
players-only: '<gray>Use this command in game.</gray>'
from-spawn: '<yellow>The survival shuttle departs from Black Spire Outpost.</yellow>'
dismount: '<yellow>Dismount and leave passengers behind before travelling.</yellow>'
departing: '<gold>Departing in {seconds} seconds. Stand still; movement or damage cancels departure.</gold>'
cancelled: '<yellow>Departure cancelled. Type /survival to try again.</yellow>'
arrived: '<green>You have reached the protected survival landing. Walk out until the leaving-safe-zone message appears; you can build beyond it.</green>'
already-departing: '<yellow>Your shuttle is preparing. Stand still.</yellow>'

teleport:
  countdown-title: '<gradient:#FFCC66:#55FFFF><bold><seconds></bold></gradient>'
  countdown-subtitle: '<gray>Preparing transport… <white>Stand still</white></gray>'
  success-title: '<aqua><bold>TRANSPORT COMPLETE</bold></aqua>'
  success-subtitle: '<gray>You have arrived.</gray>'
  moved: '<red>You moved. Teleportation cancelled.</red>'
  damaged: '<red>You took damage. Teleportation cancelled.</red>'
  interrupted: '<yellow>Teleportation cancelled.</yellow>'
  unavailable: '<red>That destination is unavailable. Teleportation cancelled.</red>'
  combat: '<red>You cannot teleport during combat.</red>'
  mounted: '<yellow>Dismount and leave passengers behind before teleporting.</yellow>'
  pending: '<yellow>You already have a teleport counting down.</yellow>'
  players-only: '<gray>Use this command in game.</gray>'
