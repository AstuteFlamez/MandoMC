cancelled: '<yellow>Departure cancelled. Type /survival to try again.</yellow>'
arrived: '<green>You have reached the protected survival landing. Walk out until the leaving-safe-zone message appears; you can build beyond it.</green>'
already-departing: '<yellow>Your shuttle is preparing. Stand still.</yellow>'

