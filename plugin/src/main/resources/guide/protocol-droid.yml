knowledge:
  identity:
    tags: who you name identity droid protocol m4 nd mando yourself
    facts: M4-ND, pronounced Mando, is MandoMC’s resident protocol droid at Batuu spawn. He explains verified MandoMC
      information, is formal, helpful and slightly anxious about danger, and cannot perform actions.
    answer: Greetings, traveler. I am M4-ND, pronounced Mando, the protocol and information droid stationed at Batuu.
      I explain MandoMC’s systems. Dangerous expeditions are, thankfully, your department.
  recipes:
    tags: recipe recipes craft crafting ingredient ingredients search equipment
    facts: Use /recipes for crafting recipes and ingredient acquisition notes. Search matches output names by default.
      Toggle Uses this ingredient to find recipes consuming an item. Click an ingredient to open its recipe or read
      its source. Back preserves search results.
    answer: Open /recipes, traveler. Search by the item’s name, or switch to Uses this ingredient. Clicking an ingredient
      explains its recipe or source.
  jawas:
    tags: jawa jawas shops shop buy buying sell selling salvage parts components electronics electronic stock traders
    facts: 'Brown Jawas roam Tatooine and sell basic electronic components plus one to three random advanced parts.
      Each spawned Jawa keeps the same item selection for its lifetime, across menu opens, chunk unloads and restarts.
      Seven gray Jawas at Batuu spawn sell ordinary supplies in seven titled categories: Plants & Dyes, Farming,
      Ocean Goods, Nether Goods, End Goods, General Supplies and Minerals. Every gray Jawa also opens Sell Goods
      to buy approved salvage; place items then confirm Sell, and unsupported items are returned. Closing cancels
      unsold deposits.'
    answer: Brown Jawas on Tatooine sell components. Their advanced finds vary, but each Jawa keeps its stock. At
      Batuu, seven titled gray Jawa shops sell ordinary supplies. Choose Sell Goods to sell approved salvage.
  koth:
    tags: koth hill key keys black kyber crystal darksaber dark saber rewards reward loot
    facts: KOTH is on Hoth. Hold the hill continuously for three minutes. A clan retains progress while an eligible
      member remains; clearing its last holder resets it. One random eligible winning member inside receives one
      KOTH key. An unaffiliated player can compete alone. Each key rolls one finished gun, Jetpack I book, vehicle
      or Black Kyber. No armor rewards. Black Kyber has a 1% configured chance and is required in the Darksaber
      recipe; the old white-saber conversion is removed. Guns include SE-14C, A280, EE-3, Jawa Ionization Blaster
      Cycler Rifle and Bossk’s Relby V10. Use /events for the schedule and /crates preview koth for exact current
      rewards.
    answer: Win KOTH on Hoth for a chance at a KOTH key. The crate contains guns, Jetpack I, vehicles and rare Black
      Kyber for crafting the Darksaber. Check /crates preview koth for the current chances, traveler.
  forge:
    tags: forge upgrade upgrades upgraded stats damage speed defense guard throw lightsaber lightsabers saber sabers
    facts: 'Craft a Saber Forge using /recipes and place it. Hold a lightsaber and right-click the forge in Survival
      or Adventure outside combat. Six total permanent upgrade points, maximum three in any path. Damage adds 1
      melee damage per level; Speed adds 0.1 attacks per second; Defense reduces guard drain from hits by 10% per
      level; Throw adds 2 throw damage per level. Materials and costs are displayed; costs increase with the next
      level. The machine consumes the shown materials and upgrades the held saber. Choose a saber style before upgrading:
      upgraded sabers cannot be stonecut into other styles. Guard recharges while resting, hold use to block/reflect,
      sneak plus attack throws.'
    answer: Craft and place a Saber Forge, then use it while holding your saber. Spend materials on Damage, Speed,
      Defense or Throw. You have six permanent points and can put at most three into one path. Choose your saber
      style first.
  travel:
    tags: planet planets travel warp spawn batuu hoth tatooine mandalore naboo ilum teleport
    facts: Use /warp for the current galaxy map and /spawn to return to Batuu. Travel has a stationary warmup and
      is blocked in combat. Naboo is recommended for a first base. Vehicle-based interplanetary travel is deferred;
      current ships do not replace warps.
    answer: Use /warp to choose a planet, or /spawn to return to Batuu. Stand still during travel and leave combat
      first. Naboo is a good place to begin your first base.
  clans:
    tags: clan clans base claim claims home raid raiding warpoints rivalry
    facts: Use /c for clan commands and /c map for zones and claims. Wilderness is claimable subject to clan limits
      and spacing. A +10 pairwise net-kill lead permits an approved explosive breach against that rival; the first
      breach begins a fixed one-hour raid and resets/freezes that rivalry for the hour. Clanmates cannot damage
      one another. Safezones stay protected. Unclaimed wilderness edits restore after 24 hours without edits.
    answer: Use /c for clan commands and /c map to inspect zones and claims. Build in eligible Wilderness, traveler.
      Safezones are protected, and rival raids require a pairwise ten-kill lead before an approved breach.
  credits:
    tags: money credit credits balance pay auction auctionhouse earning earn currency
    facts: Use /balance to view credits, /pay to send credits and /ah for player trading. Sell approved salvage
      to gray Jawas at Batuu. Each optional tutorial section grants 500 credits only on its first completion. Genuinely
      new players begin with 2500 credits once. Voting grants 500 credits and a Voting Crate key per configured
      accepted vote.
    answer: Check /balance for your credits. Gray Jawas buy approved salvage, and /ah handles player trading. Each
      tutorial section pays 500 credits on its first completion.
  tutorial:
    tags: tutorial start starting beginner beginners learn learning guide help
    facts: 'Use /tutorial for five optional sections: Survival, Clans, Combat, Shops and Vehicles. Each pays 500
      credits once on its first completion. Sections may be replayed without repeating the reward. /tutorial end
      restores your normal inventory and leaves the lesson.'
    answer: Start /tutorial and choose a lesson, traveler. Each section awards 500 credits the first time you complete
      it. Use /tutorial end whenever you wish to leave.
  jetpack:
    tags: jetpack enchant enchantment book books coal thrust flight flying
    facts: Jetpack I is an enchanted book from Boba Fett or the KOTH crate. At an Agrinium Anvil, combine two Jetpack
      I books into Jetpack II or apply a book to a chestplate. Normal anvil XP costs apply. Double sneak toggles
      thrust while worn; hotbar coal supplies fuel. I gives 0.1 seconds per coal, II gives 0.2 seconds.
    answer: Apply a Jetpack book to your chestplate at an Agrinium Anvil. Two Jetpack I books combine into II. Wear
      it, keep coal in your hotbar and double sneak to toggle thrust.
  jabba:
    tags: jabba palace dungeon boba guard guards boss bosses guns blaster blasters weapon weapons rifle cycler
    facts: Jabba’s Palace is a scheduled shared PvP dungeon. Its loot is open to competitors. Quarren guards can
      drop SE-14C, Twi’lek guards A280, Boba Fett EE-3 and Jetpack books, and brown Jawas an Ionization Blaster.
      Bossk can drop his Relby V10. These guns and Cycler Rifle also appear in KOTH rewards. Use /events for the
      schedule.
    answer: 'Jabba’s Palace opens through the event schedule. Fight guards and bosses for loot, but watch for rival
      players: the dungeon is shared. Use /events to check when it opens.'
