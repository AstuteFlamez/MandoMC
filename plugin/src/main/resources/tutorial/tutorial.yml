    action: '<gold>/events · Beskar Rush <gray>— Compete for rare Beskar on Mandalore.'
    hologram: '<gold><bold>Beskar Rush</bold><newline><white>Mine the event’s limited Beskar deposits.<newline><white>Compete with other players on Mandalore.<newline><gray>Bring equipment and watch your surroundings.<newline><yellow>/events shows the next event.'
