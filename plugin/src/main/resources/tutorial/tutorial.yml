  1:
    action: '<gold>/events · Jabba’s Palace <gray>— Fight through rooms and bosses for loot.'
    hologram: '<gold><bold>Jabba’s Palace</bold><newline><white>Clear the guards, rooms and bosses.<newline><white>Defeat the Rancor, then collect your loot.<newline><gray>Watch for rival players: the loot is shared.<newline><yellow>/events shows when it opens.'
