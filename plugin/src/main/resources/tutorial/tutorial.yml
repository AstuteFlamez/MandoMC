holograms:
  warp: '<gold><bold>Welcome to MandoMC</bold><newline><white>Your own training area. Learn by doing.<newline><yellow>/warp <gray>→ choose the Tutorial diamond<newline><gray>You can leave any time: /tutorial end'
  create: '<gold>Make a home with your clan<newline><white>/c create <name><newline><gray>This practice clan will not affect your real clan.'
  claim: '<gold>Protect your base<newline><white>Walk along the path to X 48–63.<newline><yellow>/c claim<newline><gray>Leave one empty chunk beside protected land.'
  disband: '<gold>Your practice chunk is claimed<newline><white>/c disband<newline><gray>Disbanding removes the practice clan and its claim.'
  combat: '<gold>Blaster training<newline><white>Defeat all three Gamorrean guards.<newline><yellow>Use: fire · Drop key: reload<newline><gray>You cannot die here. Ammo refills when empty.'
  saber: '<gold>Lightsabers & Ilum<newline><white>Complete Ilum’s course for a Kyber key.<newline><white>Open the Kyber crate to obtain crystals.<newline><yellow>Sneak + attack to throw your saber once.'
  buy: '<gold>Tatooine · Brown Jawa supplies<newline><white>Right-click a brown Jawa to browse.<newline><yellow>Buy Oak Saplings ×4 for $40.<newline><gray>Your practice wallet has $100.'
  sell: '<gold>Gray Jawas buy salvage<newline><white>Right-click the buyer.<newline><yellow>Click your scrap to add it, then click Sell.<newline><gray>Closing the window returns unsold items.'
  recipes: '<gold>Craft your equipment<newline><yellow>/recipes<newline><white>Explore items, ingredients and their sources.<newline><gray>Close the guide to continue.'
  flight: '<gold>X-wing flight training<newline><white>Right-click the X-wing to board.<newline><yellow>Forward + Jump: take off · Look to steer<newline><white>Fly airborne for 10 seconds.<newline><gray>The training ship cannot be lost.'
  target: '<gold>Gunnery target<newline><white>Aim your X-wing at the bullseye.<newline><yellow>Attack / left-click: fire cannons<newline><gray>A direct cannon hit completes the exercise.'
