name: Server checks and upload

on:
  pull_request:
    branches: [main, dev, hotfix]
  push:
    branches: [main, dev, hotfix, 'bilal/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Server checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install SFTP tooling
        run: python -m pip install -r deployment/requirements.txt
      - name: Check branch policy
        run: python scripts/check-branch-policy.py
      - name: Prepare public compile API
        run: python scripts/prepare-ci.py
      - name: Build plugin and test
        run: ./scripts/build.sh
      - name: Test tooling and validate resource pack
        run: |
          python -m unittest discover -s scripts/tests -v
          python scripts/build-resource-pack.py
          python -c "import runpy; runpy.run_path('scripts/pebblehost.py')['payload']()"

  upload:
    name: Upload production files; restart manually
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PEBBLEHOST_BOOTSTRAPPED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: pebblehost-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install upload tooling
        run: python -m pip install -r deployment/requirements.txt
      - name: Build the exact main commit
        run: |
          python scripts/prepare-ci.py
          ./scripts/build.sh
      - name: Skip superseded main commits
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload and verify files over pinned SFTP
        if: steps.current.outputs.deploy == 'true'
        env:
          PEBBLEHOST_SFTP_JSON: ${{ secrets.PEBBLEHOST_SFTP_JSON }}
        run: python scripts/pebblehost.py deploy --commit "$GITHUB_SHA" --apply
      - name: Report pending manual restart
        if: steps.current.outputs.deploy == 'true'
        run: echo 'Production files uploaded. Click Restart in PebbleHost when ready. No restart was sent.' >> "$GITHUB_STEP_SUMMARY"
