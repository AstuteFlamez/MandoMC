# Legacy behavior with the original fixed combat stats.
Massiff:
  Type: ZOMBIE
  Display: '&6&lMassiff'
  Health: 50
  Damage: 0
  Faction: Tusken
  Model:
    Id: massiff
    ViewRadius: 64
    Drive: false
    DamageTint: true
  Options:
    Silent: true
    PreventOtherDrops: true
    MovementSpeed: 0.12
    MaxCombatDistance: 24
    PreventSunburn: true
    PreventJockeyMounts: true
    PreventRandomEquipment: true
    PreventItemPickup: true
    PreventTransformation: true
    Despawn: true
    FollowRange: 24
  AIGoalSelectors:
    - clear
    - meleeattack
    - randomstroll
    - lookatplayers
  AITargetSelectors:
    - clear
    - players
  Modules:
    ThreatTable: true
  Skills:
    - model{mid=massiff} @self ~onSpawn
    - state{mid=massiff;s=idle;lerpin=5} @self ~onSpawn
    - model{mid=massiff} @self ~onLoad
    - skill{s=MandoFaceTargetNow} @trigger ~onAttack
    - skill{s=Massif_Combat} @self ~onTimer:35
    - skill{s=Massif_Idle} @self ~onTimer:35
    - sound{s=entity.hoglin.death;v=1;p=0.7} @self ~onDeath
    # MassiffDrops supplies catalog food through Mythic's death-drop list (75%).
    - sound{s=entity.zoglin.hurt;v=1;p=0.8} @self ~onDamaged 0.5
