# MythicMobs owns AI, health and level. MandoMC owns group placement and population budgets.
# Loot and equipment drops intentionally wait for the next progression pass.
TuskenRaiderSniper:
  Type: ZOMBIE
  Display: '&6Tusken Raider &7[Lv. <caster.level>]'
  Health: 20
  Damage: 3
  Faction: Tusken
  LevelModifiers:
    Health: 4
    Damage: 0.5
  Options:
    PreventSunburn: true
    PreventJockeyMounts: true
    PreventRandomEquipment: true
    PreventOtherDrops: true
    PreventItemPickup: true
    PreventTransformation: true
    Despawn: true
    Silent: true
    MovementSpeed: 0.27
    FollowRange: 32
    KnockbackResistance: 0.2
    AlwaysShowName: false
  AIGoalSelectors:
    - clear
    - lookattarget
    - movetowardsdistanceoftarget{s=1;minr=10;maxrange=16}
    - fleeTarget{s=1;distance=6}
    - randomstroll
    - lookatplayers
  AITargetSelectors:
    - clear
    - players
  Modules:
    ThreatTable: true
  Skills:
    - model{mid=ranged_raider} @self ~onSpawn
    - model{mid=ranged_raider} @self ~onLoad
    - skill{s=MandoTuskenCycler} @target ~onTimer:80
    - sound{s=mandomc:mobs.tuskenraider;v=1.5;p=1} @self ~onTimer:160 0.25

