# MythicMobs owns AI, health and entity lifecycle. MandoMC owns group placement and population budgets.
# Tusken weapon drops are supplied once through the Mythic death integration (10% each).
TuskenRaiderSniper:
  Type: ZOMBIE
  Display: '&6Tusken Raider'
  Health: 20
  Damage: 3
  Faction: Tusken
  Options:
    PreventSunburn: true
    PreventJockeyMounts: true
    PreventRandomEquipment: true
    PreventOtherDrops: true
    PreventItemPickup: true
    PreventTransformation: true
    Despawn: true
    Silent: true
    MovementSpeed: 0.27
    FollowRange: 32
    KnockbackResistance: 0.2
    AlwaysShowName: false
  AIGoalSelectors:
    - clear
    - lookattarget
    # Faster combat goals; ordinary wandering retains speed 1 / base 0.27.
    - fleePlayers{speed=1.3;safespeed=1.3;distance=8}
    - moveWithinDistanceOfTarget{speed=1.3;minrange=16;maxrange=32}
    - randomstroll
    - lookatplayers
  AITargetSelectors:
    - clear
    - players
  Modules:
    ThreatTable: true
  Skills:
    - model{mid=ranged_raider;h=false} @self ~onSpawn
    - model{mid=ranged_raider;h=false} @self ~onLoad
    - skill{s=MandoTuskenRelax} @self ~onDropCombat
    - skill{s=MandoTuskenCombatMovement} @target ~onTimer:10
    - skill{s=MandoTuskenCycler} @target ~onTimer:80
    - skill{s=MandoTuskenVoice} @self ~onTimer:160 0.25

