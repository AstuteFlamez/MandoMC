    - skill{s=MandoTuskenVoice} @self ~onTimer:160 0.25

Bantha:
  Type: HORSE
  Display: '&6Bantha'
  Health: 50
  Damage: 0
  Options:
    Tameable: true
    Silent: true
    PreventOtherDrops: false
    PreventItemPickup: true
    PreventLeashing: false
    PreventRenaming: true
    Despawn: true
    MovementSpeed: 0.18
    AlwaysShowName: false
  AIGoalSelectors:
    - clear
    - 0 float
    - 1 panic
    - 4 randomstroll
    - 5 lookatplayers
  AITargetSelectors:
    - clear
  Skills:
    - model{mid=bantha} @self ~onSpawn
