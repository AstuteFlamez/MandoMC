    - lineofsight
    - distance{d=0to32}
  Skills:
    - skill{s=MandoFaceTarget} @target
    - weaponMechanicsShoot{weapon=QuarrenSE14C;spread=2;head=false} @target

JabbaFireA280:
  Conditions:
    - health{h=>0} true
  TargetConditions:
    - health{h=>0} true
    - lineofsight
    - distance{d=0to32}
  Skills:
