Gamorrean_Brain:
  Conditions:
    - health{h=>0} true
  Skills:
    - randomskill{skills=Light_Slash 0.5, Heavy_Slash 0.3, Spin_Attack 0.2}

# Original weighted light, heavy and spin attacks.
Light_Slash:
  Conditions:
  - targetwithin{d=3} true
  Skills:
    - skill{s=MandoFaceTarget;repeat=32;repeatInterval=1} @target
    - delay 6
    - state{mid=gamorrean_guard;s=attack1} @self
    - delay 10
    - sound{s=item.axe.scrape;v=2;p=1;c=MASTER} @self
    - skill{s=JabbaLightHit} @Target

Heavy_Slash:
  Conditions:
  - targetwithin{d=3} true
  Skills:
    - skill{s=MandoFaceTarget;repeat=32;repeatInterval=1} @target
    - delay 6
    - state{mid=gamorrean_guard;s=attack2} @self
    - delay 10
    - sound{s=item.trident.throw;v=2;p=1;c=MASTER} @self
    - skill{s=JabbaHeavyHit} @Target

Spin_Attack:
  Conditions:
  - targetwithin{d=4} true
  Skills:
    - skill{s=MandoFaceTarget;repeat=32;repeatInterval=1} @target
    - delay 6
    - state{mid=gamorrean_guard;s=attack3} @self
    - delay 10
    - sound{s=item.axe.scrape;v=2;p=1;c=MASTER} @self
    - skill{s=JabbaSpinHit} @PlayersInRadius{r=4}

quarren_attack:
  Cooldown: 2.5to4.5
  Conditions:
    - health{h=>0} true
    - incombat true
    - hasaura{aura=JabbaAiming} false
    - hasaura{aura=JabbaInitialWait} false
  TargetConditions:
    - health{h=>0} true
    - distance{d=0to32}
    - lineofsight
  Skills:
    - stun{auraName=JabbaAiming;d=52;facing=false;stopai=true;gravity=false;onEnd=JabbaCombatMovement} @self
    - skill{s=MandoFaceTarget;repeat=32;repeatInterval=1} @target
    - delay 6
    - state{mid=quarren_guard;s=attack} @self
    - delay 10
    - skill{s=MandoFaceTarget} @target
    - skill{s=JabbaFireSE14C} @Target
    - delay 4
    - skill{s=MandoFaceTarget} @target
    - skill{s=JabbaFireSE14C} @Target
    - delay 4
    - skill{s=MandoFaceTarget} @target
    - skill{s=JabbaFireSE14C} @Target
    - delay 20
    - state{mid=quarren_guard;s=attack;r=true} @self


