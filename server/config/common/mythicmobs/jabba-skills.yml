# Shared ranged movement. Threat tables own combat state; aim aura owns planted attacks.
JabbaCombatMovement:
  Conditions:
    - health{h=>0} true
    - incombat true
    - hasaura{aura=JabbaAiming} false
  TargetConditions:
    - health{h=>0} true
    - distance{d=0to32}
  Skills:
    - skill{s=JabbaReposition} @target

JabbaReposition:
  Cooldown: 1.25
  Conditions:
    - incombat true
    - hasaura{aura=JabbaAiming} false
  TargetConditions:
    - health{h=>0} true
    - distance{d=7to18}
  Skills:
    - goto{speed=1.15} @RandomLocationsNearCaster{amount=3;limit=1;minradius=3;radius=5;onsurface=true}

JabbaRelax:
  Conditions:
    - incombat false
  Skills:
    - clearpath @self
