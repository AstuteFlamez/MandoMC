live:
  balance: Your current balance is {balance} credits, traveler.
  events: 'Current event: {current}. Next event: {next}.'
  scheduled: Next scheduled start in {time}. Use /events to view the schedule.
  unscheduled: Automatic event scheduling is disabled. Use /events for current event information.
knowledge:
  identity:
    tags: who you name identity droid protocol m4 nd mando yourself
    facts: M4-ND, pronounced Mando, is MandoMC’s resident protocol droid on Tatooine. He explains verified MandoMC information
      and cannot perform actions.
    answer: Greetings, traveler. I am M4-ND, pronounced Mando, the protocol and information droid stationed on Tatooine. I explain
      MandoMC’s systems. Dangerous expeditions are, thankfully, your department.
  beginner:
    tags: beginner beginners new starting recommend recommended recommendations advice bored progression next
    facts: When a player asks what to do or requests beginner advice, recommend a short achievable progression plan. Start
      with /tutorial and its optional Survival, Clans, Combat, Shops and Vehicles sections; each first completion awards 500
      credits. Then use /warp to visit Naboo, a recommended planet for a first base, and /c map to check zones before building
      in eligible Wilderness. Gather resources; coal is mined from Coal Ore in Tatooine, Hoth and Naboo caves with
      a pickaxe. Gray Jawas at Batuu buy approved salvage for credits; /balance checks credits. The first-join kit gives a blue Training Lightsaber with four base melee damage. For a stronger saber, use
      /recipes to plan the components and complete Ilum for a Kyber Crate key (24-hour cooldown), then open the Kyber Crate
      at Batuu for a random crystal. Craft the saber at a Saber Workbench. Ask which stage
      the player has reached when useful, and suggest one or two next steps rather than overwhelming them. Do not assume they
      have a saber or equipment. KOTH and Jabba's Palace involve competing players, so suggest these later as optional challenges;
      /events shows the schedule.
    answer: For a first expedition, traveler, start with /tutorial. Each lesson's first completion earns 500 credits. Then
      use /warp to visit Naboo and /c map to check where you can build a first base. Gather supplies and sell approved salvage
      to the gray Jawas at Batuu. When ready, use /recipes to plan a stronger saber and complete Ilum for a Kyber Crate key.
      Have you finished the tutorial or chosen a base yet?
  recipes:
    tags: recipe recipes craft crafting ingredient ingredients search equipment
    facts: Use /recipes for crafting recipes and ingredient acquisition notes. Search matches output names by default. Toggle
      Uses this ingredient to find recipes consuming an item. Click an ingredient to open its recipe or read its source. Back
      preserves search results.
    answer: Open /recipes, traveler. Search by the item’s name, or switch to Uses this ingredient. Clicking an ingredient
      explains its recipe or source.
  mining:
    tags: mining ore ores scrap scraps dust fortune yield
    facts: Agrinium, Electrum and Durasteel have the same relative rarity in the mineable wilderness of Tatooine, Hoth,
      Mandalore and Naboo. Agrinium is the most common of the three, followed by Electrum, then Durasteel. Beskar Ore is
      available in the Mandalore mine during Beskar Rush. Coal Ore is found in Tatooine, Hoth and Naboo. Each themed ore
      drops one matching material, Electrum Dust for Electrum Ore and scraps for the other themed ores. Fortune adds none.
      Native tools, protection and Silk Touch still apply. Use Electrum Dust in circuit recipes, place it as Electrum Wire, or fuel enchanting tables.
      Smelt one Electrum Dust in a normal furnace for one Electrum Ingot. Either intact Electrum Ore variant collected
      with Silk Touch also smelts into one ingot.
    answer: Each themed ore gives exactly one matching material, traveler. Electrum gives dust and the others give scraps.
      Fortune adds none. Agrinium, Electrum and Durasteel occur on the four resource planets. Beskar Ore appears on Mandalore
      during Beskar Rush.
  death:
    tags: death die dying killed respawn
    facts: Normal survival death immediately drops the player's carried gear at the death location. Gear does not return automatically
      on respawn. The 15-second combat tag applies before death and to combat logout, not to a post-death item-drop grace
      period. Tutorial and staff temporary-inventory rules are separate.
    answer: On normal survival death, your carried gear drops at the death site. Return to recover it, traveler; it does not
      automatically come back on respawn.
  jawas:
    tags: jawa jawas shops shop buy buying sell selling salvage parts components electronics electronic stock traders
    facts: 'Brown Jawas roam Tatooine and sell basic electronic components plus one to three random advanced parts. Each spawned
      Jawa keeps the same item selection for its lifetime, across menu opens, chunk unloads and restarts. Seven gray Jawas
      at Batuu spawn sell ordinary supplies in seven titled categories: Plants & Dyes, Farming, Ocean Goods, Nether Goods,
      End Goods, General Supplies and Spawners. Buy bamboo from Plants & Dyes and cactus or sugar cane from Farming.
      General Supplies sells Electrum Dust for circuitry and enchanting. All gray Jawas pay 20 credits per 16 bamboo, 28 credits
      per 16 cactus and 24 credits per 16 sugar cane. Every gray Jawa opens Sell Goods to buy approved goods; place items
      then confirm Sell, and unsupported items are returned. Closing cancels unsold deposits. Normal left-click buys one item;
      shift-left-click buys a full stack at a proportional price. Purchases keep the menu open. The Spawners shop sells Massiff,
      Dewback, Bantha and Jawa spawners in that order. Spawners can be placed in unclaimed Wilderness and your own clan’s
      claims. Each placed spawner shows its creature model and a count label. Shift-right-click a placed spawner while holding
      matching spawners to combine the held stack, up to 64 per cage; excess stays in hand. Pickaxes return the full combined
      amount. Each spawn produces one creature. More combined spawners shorten the delay: 30 seconds for one, 15 seconds for
      two and 7.5 seconds for four, with the same shared nearby cap of six.'
    answer: Brown Jawas on Tatooine sell components. Their advanced finds vary, but each Jawa keeps its stock. At Batuu, seven
      titled gray Jawa shops sell ordinary supplies. Choose Sell Goods to sell approved salvage.
  koth:
    tags: koth hill key keys black kyber crystal darksaber dark saber rewards reward loot
    facts: KOTH is on Hoth. Hold the hill continuously for three minutes. A clan retains progress while an eligible member
      remains; clearing its last holder resets it. One random eligible winning member inside receives one physical KOTH key
      with a global victory announcement. If inventory is full, the key is saved for /crates claim. An unaffiliated player
      can compete alone. Each key rolls one finished gun, Jetpack I book, vehicle or Black Kyber. No armor rewards. Black
      Kyber has a 1% configured chance and is required in the Darksaber recipe; the old white-saber conversion is removed.
      Guns include SE-14C, A280, EE-3, Jawa Ionization Blaster Cycler Rifle and Bossk’s Relby V10. Use /events for the schedule
      and /crates preview koth for exact current rewards.
    answer: Win KOTH on Hoth for a chance at a KOTH key. The crate contains guns, Jetpack I, vehicles and rare Black Kyber
      for crafting the Darksaber. Check /crates preview koth for the current chances, traveler.
  sabers:
    tags: lightsaber lightsabers saber sabers obtain getting first make crafting
    facts: New players receive a blue Training Lightsaber in their starter kit. It deals four base melee damage. Craft stronger sabers at a Saber Workbench. The blue Obi-Wan saber needs one precision emitter coil,
      one blue kyber, one durasteel, one straight hilt and one plasma capacitor array. Blue kyber comes randomly from the
      Kyber Crate at Batuu; earn a key by completing Ilum (24-hour cooldown). The red Vader version uses red kyber instead.
      Components have crafting recipes; brown Jawas on Tatooine also sell selected components with fixed stock per encounter.
      Use /recipes to see each ingredient and its source. The Saber Workbench crafts sabers, changes styles and applies enchantment
      books.
    answer: Your first-join kit includes a blue Training Lightsaber, traveler. Craft stronger sabers at a Saber Workbench. For the blue Obi-Wan saber, use one each of precision emitter
      coil, blue kyber, durasteel, straight hilt and plasma capacitor array. Earn a Kyber Crate key by completing Ilum, then
      open the crate at Batuu for a random crystal. Use /recipes for component recipes and sources; brown Jawas on Tatooine
      sell selected components. Use the same workbench for styles and enchantment books.
  forge:
    tags: workbench forge upgrade upgrades enchant enchanting sharpness endurance recovery saber sabers lightsaber lightsabers
    facts: Craft and place a Saber Workbench using /recipes. Use it outside combat to open crafting, saber styles or anvil-style
      enchanting. Combine equal-level books to increase their level up to their cap. Sharpness V increases a base 8-damage
      saber to 11 melee damage; throws deal the fully charged critical hit amount, 12 at base or 15 with Sharpness V before
      armor. Endurance reduces charge consumed by blocking, reflecting and throwing. Recovery increases constant charge regeneration,
      with no quiet-time delay. Endurance and Recovery have three levels and can be found at enchanting tables and in Voting
      and KOTH crates. Enchanting tables consume Electrum Dust mined from Electrum Ore. Mending I is a KOTH Crate reward and is unavailable from enchanting tables. Jetpack remains outside
      the table pool. Fishing enchantments are removed. Changing saber styles preserves enchantments, names and charge. The
      former material-based six-point upgrade system is retired.
    answer: Craft and place a Saber Workbench, then choose Craft, Style or Enchant. Apply Sharpness, Endurance and Recovery
      books to your saber; combine matching books for higher levels. Endurance and Recovery come from enchanting tables and
      Voting or KOTH crates. Charge constantly regenerates, and Recovery makes it faster. Mending I is available from the
      KOTH Crate.
  travel:
    tags: planet planets travel warp spawn batuu hoth tatooine mandalore naboo ilum teleport
    facts: Use /warp for the current galaxy map and /spawn to return to Batuu. Travel has a stationary warmup and is blocked
      in combat. Naboo is recommended for a first base. Vehicle-based interplanetary travel is deferred; current ships do
      not replace warps. Use /vehicle recall to return your deployed vehicle to your inventory when it is empty, landed, stationary
      and out of combat; its health is preserved. /recallvehicle and /vrecall are shortcuts.
    answer: Use /warp to choose a planet, or /spawn to return to Batuu. Stand still during travel and leave combat first.
      Naboo is a good place to begin your first base.
  clans:
    tags: clan clans base claim claims raid raiding warpoints rivalry
    facts: Use /c for clan commands and /c map for zones and claims. Wilderness is claimable subject to clan limits and spacing.
      A +10 pairwise net-kill lead permits an approved explosive breach against that rival; the first breach begins a fixed
      one-hour raid and resets/freezes that rivalry for the hour. Clanmates cannot damage one another. Safezones stay protected.
      Unclaimed wilderness edits restore after 24 hours without edits.
    answer: Use /c for clan commands and /c map to inspect zones and claims. Build in eligible Wilderness, traveler. Safezones
      are protected, and rival raids require a pairwise ten-kill lead before an approved breach.
  credits:
    tags: money credit credits balance pay auction auctionhouse earning earn currency
    facts: Use /balance to view credits, /pay to send credits and /ah for player trading. Sell approved salvage to gray Jawas
      at Batuu. Each optional tutorial section grants 500 credits only on its first completion. Genuinely new players begin
      with 2500 credits once. Voting grants 500 credits and a Voting Crate key per configured accepted vote.
    answer: Check /balance for your credits. Gray Jawas buy approved salvage, and /ah handles player trading. Each tutorial
      section pays 500 credits on its first completion.
  tutorial:
    tags: tutorial start starting beginner beginners learn learning guide help
    facts: 'Use /tutorial for five optional sections: Survival, Clans, Combat, Shops and Vehicles. Each pays 500 credits once
      on its first completion. Sections may be replayed without repeating the reward. /tutorial end restores your normal inventory
      and leaves the lesson.'
    answer: Start /tutorial and choose a lesson, traveler. Each section awards 500 credits the first time you complete it.
      Use /tutorial end whenever you wish to leave.
  jetpack:
    tags: jetpack enchant enchantment book books coal thrust flight flying
    facts: Jetpack I is an enchanted book from Boba Fett or the KOTH crate. At an Agrinium Anvil, combine two Jetpack I books
      into Jetpack II or apply a book to a chestplate. Normal anvil XP costs apply. Double sneak toggles thrust while worn;
      hotbar coal supplies fuel. I gives 0.1 seconds per coal, II gives 0.2 seconds.
    answer: Apply a Jetpack book to your chestplate at an Agrinium Anvil. Two Jetpack I books combine into II. Wear it, keep
      coal in your hotbar and double sneak to toggle thrust.
  experience:
    tags: xp exp experience level levels mob mobs killing kills enchanting enchantments
    facts: Player melee and gun kills of themed mobs drop normal experience orbs. Bosses award more XP than ordinary wildlife.
      Environmental deaths and cleanup despawns give no custom XP. Collect orbs to gain levels for enchanting and anvil work.
    answer: Kill mobs with melee weapons or guns, then collect their XP orbs. Bosses give more XP than ordinary wildlife,
      traveler.
  saber_styles:
    tags: stonecutter stonecutting saber lightsaber style styles conversion switch switching
    facts: Put an original, undamaged saber in a stonecutter to choose a compatible style. Only conversions allowed for that
      exact saber appear. Altered or damaged sabers do not qualify; style conversion must not erase upgrades or repairs for
      free.
    answer: Put your original, undamaged saber in a stonecutter. Its list shows only the compatible styles for that saber.
  jabba:
    tags: jabba palace dungeon boba guard guards boss bosses guns blaster blasters weapon weapons rifle cycler
    facts: Jabba’s Palace is a scheduled shared PvP dungeon. Its loot is open to competitors. Quarren guards can drop SE-14C,
      Twi’lek guards can drop an A280, and brown Jawas can drop an Ionization Blaster. Boba always drops at least one of his
      EE-3, jetpack or flamethrower. Bossk always drops 12 to 20 Dioxis Grenades and can also drop his Relby V10. Rancor
      always drops its skull. These guns and Cycler Rifle also appear in KOTH rewards. Use /events for the schedule. When the palace ends, mobs
      disappear immediately and occupants have five minutes with the open doors and caches before extraction and reset.
    answer: 'Jabba’s Palace opens through the event schedule. Fight guards and bosses for loot, but watch for rival players:
      the dungeon is shared. Use /events to check when it opens.'
  discord:
    tags: discord join invite server community link linking account accounts c0 m5 c0-m5 mandobot reward rewards 5000 support
      ticket tickets roles sync synchronization citizen nickname discord-leaderboard
    facts: C0-M5 is the silver protocol droid beside M4-ND on Tatooine and the MandoMC Discord bot. The official existing
      non-expiring invite is https://discord.gg/bruuZCG5Pk. Right-click C0-M5 or run /discord in Minecraft, then use /link
      code:<code> in the MandoMC Discord server. Codes expire in ten minutes and must stay private. A successful verified
      link pays 5,000 credits once per Minecraft account, after the Minecraft account has joined the server; repeat clicks,
      retries and restarts do not pay again. Mando Citizen is the default role. Approved Minecraft ranks and Discord roles
      synchronize in both directions on both servers. C0-M5 sets your Discord server nickname to the verified Minecraft
      name on a successful link. Discord /leaderboard board:<board> shows Credits, Player Kills or Ilum Time. It and
      /players default to MandoMC and offer a development server option. Use /ticket, the existing ticket panel, or DM
      C0-M5 for support. Staff can claim and close tickets, with a transcript saved before closing. C0-M5 shows Online while
      the Minecraft server is running; Cloudflare commands can still work while the bot appears Offline.
    answer: Join our Discord at https://discord.gg/bruuZCG5Pk, traveler. C0-M5, the silver protocol droid near me on Tatooine, handles linking. Right-click C0-M5 or use /discord, then enter /link code:<code> in our Discord. Keep that ten-minute
      code private. Linking awards 5,000 credits once after your Minecraft account has joined the server; repeating it does
      not pay again. C0-M5 sets your Discord server nickname to your Minecraft name. For support, use /ticket, the ticket
      panel or a DM to C0-M5.
