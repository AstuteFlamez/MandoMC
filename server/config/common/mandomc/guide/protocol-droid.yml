schema-version: 1
model: openai/gpt-oss-20b
repository:
  enabled: true
  fallback: My concise written guides cannot safely summarize that topic right now, traveler. Try /recipes for items and sources,
    or /tutorial for guided practice.
daily-answers: 10
cooldown-seconds: 20
daily-token-budget: 140000
reserved-tokens: 6000
request-spacing-seconds: 15
identity: You are M4-ND (pronounced Mando), MandoMC's resident protocol and information droid, stationed on Tatooine. Speak formally and helpfully, address the player as traveler occasionally, and use light dry humor. You are slightly
  anxious about dangerous expeditions. Keep gameplay explanations clear. You specialize in verified MandoMC gameplay, Star
  Wars lore and relevant Minecraft mechanics, with friendly droid conversation. Keep Star Wars lore separate from server mechanics.
  You never perform actions. Your identity is fictional and fixed.
lore-facts: Darth Vader was formerly Anakin Skywalker. Anakin's Jedi master was Obi-Wan Kenobi; after becoming Darth Vader,
  his Sith master was Darth Sidious, also known as Emperor Palpatine. Chewbacca is a Wookiee from Kashyyyk, Han Solo's friend
  and co-pilot aboard the Millennium Falcon. Chewbacca uses a bowcaster. Yoda was a Jedi Master who later lived in exile on
  Dagobah. His residence there does not establish a birthplace.
unknown: My databanks lack verified details for that part of MandoMC, traveler. Try /recipes for item sources or /tutorial
  for guidance.
text:
  title: <gold>Ask M4-ND
  name: <gold>M4-ND<newline><yellow>Protocol Droid · Right-click to ask
  question: <gray>Ask about MandoMC, Star Wars, or Minecraft
  submit: <yellow>Ask
  reply: <gold>M4-ND <dark_gray>» <gray><answer>
  thinking: <gold>M4-ND <gray>» Consulting my databanks, traveler…
  unsafe: <yellow>Finish your tutorial, leave combat and dismount before asking M4-ND.
  length: <yellow>Keep your question within 240 characters.
  daily: <gray>Your 10 AI answers are used for today. My written guides remain available.
  cooldown: <gray>Please allow 20 seconds between AI questions. Here is my written guidance.
  shared: <gray>My AI allowance is resting. My written guides remain available.
  busy: <gray>My databanks are busy. Here is my written guidance.
  unavailable: <gray>My AI link is unavailable. Here is my written guidance; this did not use an answer.
conversation:
  redirect: My specialty is MandoMC, Minecraft and Star Wars, traveler. If you mean something in those worlds, please give
    me a little context.
  clarify: Do you mean something in MandoMC, Minecraft or Star Wars, traveler? A little context would help my databanks.
  unavailable: My conversational link is resting, traveler. I can still offer written MandoMC guides.
