      Drop_Item: true
      Arm_Swing_Animation: true
      Break_Blocks: true
  Skin:
    Default:
      Custom_Model_Data: 21
      Item_Model: "mandomc:blasters/se14c"
    Scope:
      Custom_Model_Data: 1021
      Item_Model: "mandomc:blasters/se14c_scope"
    Sprint:
      Custom_Model_Data: 2021
      Item_Model: "mandomc:blasters/se14c_sprint"
  Projectile: "redlaser"
  Shoot:
    Trigger:
      Main_Hand: "RIGHT_CLICK"
      Off_Hand: "RIGHT_CLICK"
      Circumstance:
        Swimming: "DENY"
        Sprinting: "DENY"
        Dual_Wielding: "DENY"
