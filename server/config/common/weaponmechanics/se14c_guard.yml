# Guard-only damage profile. Player gun and dropped weapon retain their original vendor ID.
QuarrenSE14C:
  Info:
    Weapon_Item:
      Type: "DIAMOND_HOE"
      Custom_Model_Data: 21
      Item_Model: "mandomc:blasters/se14c"
      Name: "<green>SE-14C Blaster Pistol"
      Lore:
        - "<white>ĖĐ"        
        - ""
        - "<gray>Imperial officer sidearm designed for efficiency."
        - "<gray>Fast firing with excellent close-quarters control."
        - ""
        - "<yellow><!italic>[<key:key.drop>] Reload"
        - ""
        - "<gray>Takes <red>Standard Plasma Cells<gray>."
      Unbreakable: true
      Hide_Flags: true
      Attributes:
        - "movement_speed -0.0019"
      Deny_Use_In_Crafting: true
    Weapon_Info_Display:
      Action_Bar:
        Message: "<green>SE-14C<firearm_state> <gray>«<red><ammo_left><gray>»<gold><reload>"
