    Fully_Automatic_Shots_Per_Second: 11
    Spread:
      Base_Spread: 4.9
      Modify_Spread_When:
        Zooming: 50%
        Sneaking: 50%
        In_Midair: 150%
    Recoil:
      Mean_X: 0.0
      Mean_Y: 0.6
      Variance_X: 0.4
      Variance_Y: 0.2
      Speed: 1.8
      Damping: 0.05
      Damping_Recovery: 0.1
      Smoothing: 0.25
      Max_Accumulation: 6.0
    Mechanics:
      - "CustomSound{sound=mandomc:shoot.cr-21, volume=6, noise=0.1}"
  Reload:
    Trigger:
      Main_Hand: "DROP_ITEM"
      Off_Hand: "DROP_ITEM"
    Magazine_Size: 32
    Reload_Duration: 31
    Start_Mechanics:
      - "CustomSound{sound=mandomc:reload.start, volume=0.5, noise=0.1}"
    Finish_Mechanics:
      - "CustomSound{sound=mandomc:reload.complete, volume=0.5, noise=0.1}"
    Ammo:
      Out_Of_Ammo_Mechanics:
        - "Message{message=<red><bold>ᴍᴀɴᴅᴏᴍᴄ</bold></red> <dark_gray>» <red>Out of plasma cells!}"
      Ammos:
        - Standard_Plasma_Cells
  Damage:
    Base_Damage: 2.5
    Armor_Damage: 1
  Scope:
    Trigger:
      Main_Hand: "LEFT_CLICK"
      Off_Hand: "LEFT_CLICK"
    Zoom_Amount: 1.3
    Shoot_Delay_After_Scope: 9
    Mechanics:
      - "CustomSound{sound=mandomc:misc.zoompistol, volume=0.5, noise=0.1, listeners=Source{}}"
    Zoom_Off:
      Mechanics:
        - "CustomSound{sound=mandomc:misc.zoompistol, volume=0.5, noise=0.1, listeners=Source{}}"
  Firearm_Action:
    Type: "SLIDE"
    Open:
      Time: 5
      Mechanics:
        - "Sound{sound=block.note_block.hat, volume=0.5, noise=0.1, listeners=Source{}}"
        - "Sound{sound=block.piston.contract, volume=0.5, noise=0.1, listeners=Source{}, delayBeforePlay=2}"
    Close:
      Time: 5
      Mechanics:
        - "Sound{sound=block.piston.extend, volume=0.5, noise=0.1, listeners=Source{}}"

  Show_Time:
    Reload:
      Item_Cooldown: true
      Exp: true
      Action_Bar: "<gray>Reloading <bar> <gray><time>s"
      Action_Bar_Cancelled: "<red>Reload Cancelled"
      Bar:
        Left_Color: "<gray>"
        Right_Color: "<red>"
        Left_Symbol: "|"
        Right_Symbol: "|"
        Symbol_Amount: 32
    Weapon_Equip_Delay:
      Item_Cooldown: true
    Shoot_Delay_After_Scope:
      Item_Cooldown: true
