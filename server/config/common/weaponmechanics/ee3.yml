EE3:
  Info:
    Weapon_Item:
      Type: "DIAMOND_HOE"
      Custom_Model_Data: 19
      Item_Model: "mandomc:blasters/ee3"
      Name: "<light_purple>EE-3 Blaster Carbine"
      Lore:
        - "<white>ĒĐ"
        - "<gray>Modified carbine favored by bounty hunters."
        - "<gray>Delivers powerful 3-round burst shots."
        - ""
        - "<yellow><!italic>[<key:key.drop>] Reload"
        - ""
        - "<gray>Takes <red>Standard Plasma Cells<gray>."
      Unbreakable: true
      Hide_Flags: true
      Attributes:
        - "movement_speed -0.0200"
      Deny_Use_In_Crafting: true

    Weapon_Info_Display:
      Action_Bar:
        Message: "<light_purple>EE3<firearm_state> <gray>«<red><ammo_left><gray>»<aqua><reload>"

    Weapon_Get_Mechanics:
      - "Sound{sound=item.armor.equip_chain, pitch=0.7, listeners=Source{}}"

    Weapon_Equip_Delay: 35

    Cancel:
      Drop_Item: true
      Arm_Swing_Animation: true
      Break_Blocks: true

  Skin:
    Default:
      Custom_Model_Data: 19
      Item_Model: "mandomc:blasters/ee3"
    Scope:
      Custom_Model_Data: 1019
      Item_Model: "mandomc:blasters/ee3_scope"
    Sprint:
      Custom_Model_Data: 2019
      Item_Model: "mandomc:blasters/ee3_sprint"

  Projectile: "redlaser"

  Shoot:
    Trigger:
      Main_Hand: "RIGHT_CLICK"
      Off_Hand: "RIGHT_CLICK"
      Circumstance:
        Swimming: "DENY"
        Sprinting: "DENY"
        Dual_Wielding: "DENY"

    Projectile_Speed: 90

    Selective_Fire:
      Trigger:
        Main_Hand: "DOUBLE_SNEAK"
        Off_Hand: "DOUBLE_SNEAK"
      Default: "BURST"
      Mechanics:
        - "Sound{sound=block.note_block.hat, pitch=1.6}"

    Delay_Between_Shots: 20

    Burst:
      Shots_Per_Burst: 3
      Ticks_Between_Each_Shot: 3

    Fully_Automatic_Shots_Per_Second: 6   # optional fallback mode

    Spread:
      Base_Spread: 2.2
      Modify_Spread_When:
        Zooming: 40%
        Sneaking: 50%
        In_Midair: 140%

    Recoil:
      Mean_X: 0.08
      Mean_Y: 1.3
      Variance_X: 0.2
      Variance_Y: 0.25
      Speed: 2.0
      Damping: 0.1
      Damping_Recovery: 0.18
      Smoothing: 0.4
      Max_Accumulation: 8.0

    Mechanics:
      - "CustomSound{sound=mandomc:shoot.ee3, volume=6, noise=0.1}"

  Reload:
    Trigger:
      Main_Hand: "DROP_ITEM"
      Off_Hand: "DROP_ITEM"

    Magazine_Size: 24
    Reload_Duration: 65

    Start_Mechanics:
      - "CustomSound{sound=mandomc:reload.start, volume=0.5, noise=0.1}"

    Finish_Mechanics:
      - "CustomSound{sound=mandomc:reload.complete, volume=0.5, noise=0.1}"

    Ammo:
      Out_Of_Ammo_Mechanics:
        - "Message{message=<red><bold>ᴍᴀɴᴅᴏᴍᴄ</bold></red> <dark_gray>» <red>Out of plasma cells!}"
      Ammos:
        - Standard_Plasma_Cells

  Damage:
    Base_Damage: 3
    Armor_Damage: 1
    Dropoff:
      - "10 -1.5"
      - "25 -3.0"
      - "50 -5.0"

  Scope:
    Trigger:
      Main_Hand: "LEFT_CLICK"
      Off_Hand: "LEFT_CLICK"

    Zoom_Amount: 1.8
    Shoot_Delay_After_Scope: 12

    Mechanics:
      - "CustomSound{sound=mandomc:misc.zoomrifle, volume=0.5, noise=0.1}"

    Zoom_Off:
      Mechanics:
        - "CustomSound{sound=mandomc:misc.zoomrifle, volume=0.5, noise=0.1}"

  Firearm_Action:
    Type: "SLIDE"

    Open:
      Time: 6
      Mechanics:
        - "Sound{sound=block.piston.contract, volume=0.5, noise=0.1}"

    Close:
      Time: 6
      Mechanics:
        - "Sound{sound=block.piston.extend, volume=0.5, noise=0.1}"

  Show_Time:
    Reload:
      Item_Cooldown: true
      Exp: true
      Action_Bar: "<gray>Reloading <bar> <gray><time>s"
      Action_Bar_Cancelled: "<red>Reload Cancelled"
      Bar:
        Left_Color: "<gray>"
        Right_Color: "<gold>"
        Left_Symbol: "|"
        Right_Symbol: "|"
        Symbol_Amount: 30

    Weapon_Equip_Delay:
      Item_Cooldown: true

    Shoot_Delay_After_Scope:
      Item_Cooldown: true